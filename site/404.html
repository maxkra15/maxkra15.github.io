<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Page not found · Maximilian Krause</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fafaf8;
      color: #192333;
      font: 1rem/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 680px; margin: 14vh auto; padding: 32px 24px; }
    .name, .code { color: #536174; }
    .name { margin-bottom: 52px; font-size: .9rem; }
    .code { margin: 0 0 12px; font-size: .875rem; }
    h1 {
      margin: 0 0 18px;
      font: 400 clamp(2.5rem, 7vw, 3.5rem)/1.15 Georgia, "Times New Roman", serif;
      letter-spacing: -.025em;
    }
    a { color: #245cab; text-underline-offset: .2em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid #245cab; outline-offset: 5px; }
    .back { display: inline-block; margin-top: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="name">Maximilian Krause · Research reports</p>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This report may have moved, or the address may be incomplete.</p>
    <a class="back" href="/">Back to research reports</a>
  </main>
</body>
</html>
